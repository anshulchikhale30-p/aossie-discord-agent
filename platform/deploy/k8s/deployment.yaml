apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontdesk
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: frontdesk
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontdesk
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontdesk
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: frontdesk
          image: ghcr.io/anshulchikhale30-p/aossie-frontdesk:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: frontdesk-config
            - secretRef:
                name: frontdesk-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: frontdesk-postgres-app
                  key: uri
            - name: WORKFLOW_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: frontdesk-postgres-app
                  key: uri
            - name: RUN_MIGRATIONS
              value: "true"
            - name: RUN_SEED
              value: "true"
            - name: RUN_WORKFLOW_BOOTSTRAP
              value: "true"
          readinessProbe:
            httpGet:
              path: /eve/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /eve/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
