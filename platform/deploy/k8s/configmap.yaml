apiVersion: v1
kind: ConfigMap
metadata:
  name: frontdesk-config
  namespace: frontdesk
data:
  NODE_ENV: production
  TENANT_SLUG: aossie
  TENANT_NAME: AOSSIE
  BOT_SLUG: frontdesk
  BOT_NAME: AOSSIE Front Desk

  PUBLIC_BASE_URL: https://frontdesk.example.com
  DISCORD_GATEWAY_WEBHOOK_URL: http://frontdesk:3000/eve/v1/discord
  DISCORD_GATEWAY_DURATION_MS: "21600000"

  LLM_MODEL: openai/gpt-5.4-mini
  LLM_CONTEXT_WINDOW: "128000"

  WORKFLOW_POSTGRES_MAX_POOL_SIZE: "10"
  WORKFLOW_POSTGRES_WORKER_CONCURRENCY: "10"
