apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: frontdesk-postgres
  namespace: frontdesk
spec:
  instances: 1
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: frontdesk
      owner: frontdesk
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  monitoring:
    enablePodMonitor: false
