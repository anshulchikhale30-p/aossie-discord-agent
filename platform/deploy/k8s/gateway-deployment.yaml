apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontdesk-discord-gateway
  namespace: frontdesk
  labels:
    app.kubernetes.io/name: frontdesk
    app.kubernetes.io/component: discord-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontdesk
      app.kubernetes.io/component: discord-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontdesk
        app.kubernetes.io/component: discord-gateway
    spec:
      initContainers:
        - name: wait-for-frontdesk
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - until curl -fsS http://frontdesk:3000/eve/v1/health; do echo waiting for frontdesk; sleep 5; done
      containers:
        - name: gateway
          image: ghcr.io/anshulchikhale30-p/aossie-frontdesk:latest
          imagePullPolicy: IfNotPresent
          command:
            - node_modules/.bin/tsx
            - scripts/discord-gateway.ts
          envFrom:
            - configMapRef:
                name: frontdesk-config
            - secretRef:
                name: frontdesk-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: frontdesk-postgres-app
                  key: uri
            - name: WORKFLOW_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: frontdesk-postgres-app
                  key: uri
            - name: RUN_MIGRATIONS
              value: "false"
            - name: RUN_SEED
              value: "false"
            - name: RUN_WORKFLOW_BOOTSTRAP
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
