apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k8s
images:
  - name: ghcr.io/anshulchikhale30-p/aossie-frontdesk
    newName: frontdesk
    newTag: dev
patches:
  - target:
      kind: Ingress
      name: frontdesk
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: localhost
      - op: remove
        path: /spec/tls
      - op: remove
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
